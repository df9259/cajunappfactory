name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  admin:
    name: admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        working-directory: admin
        run: npm ci
      - name: Run tests
        working-directory: admin
        run: npm test
